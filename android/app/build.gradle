plugins {
    id 'com.android.application'
}

// Release signing is read from android/keystore.properties (gitignored).
// Amazon strips this signature and applies its own, so the key only needs
// to exist — rotate or replace it freely.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'cooking.fifi.firetvapp'
    compileSdk 34

    defaultConfig {
        applicationId 'cooking.fifi.firetvapp'
        // Fire OS 6 (API 25) covers Fire TV Stick 4K / 2nd-gen and newer.
        minSdk 25
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                keyAlias keystoreProps['keyAlias']
                storePassword keystoreProps['storePassword']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }
}
